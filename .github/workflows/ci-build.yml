name: AK Mind Trainer CI & Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Lint, Test & Web PWA Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Linting
        run: npm run lint

      - name: Run Automated Test Suites
        run: npm test

      - name: Build Web App & PWA Production Bundle
        run: npm run build

      - name: Upload Web PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ak-mind-trainer-pwa-dist
          path: dist/
          retention-days: 14
