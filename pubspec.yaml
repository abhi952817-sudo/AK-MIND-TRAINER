name: akludo
description: AK Ludo - Premium 3D Cross-Platform Multiplayer Ludo Game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_database: ^10.5.4
  firebase_storage: ^11.7.4
  flame: ^1.17.0
  google_mobile_ads: ^5.1.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  uuid: ^4.4.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  vibration: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - assets/icons/
